[workspace]
resolver = "3"
members = ["crates/nest-core", "crates/nest-io", "crates/nest-engine", "crates/nest-cli", "app"]

[workspace.package]
edition = "2024"
version = "0.1.1"
publish = false

[workspace.dependencies]
nest-core = { path = "crates/nest-core" }
nest-io = { path = "crates/nest-io" }
nest-engine = { path = "crates/nest-engine" }
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"

# Pinned dev revisions. Rune is pre-release; bump deliberately.
jagua-rs = { git = "https://github.com/JeroenGar/jagua-rs", rev = "13a0dfbde60713458fbb524f8c043f04631067ee", features = ["bpp"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1", features = ["native-file-dialog"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }

# Rune ships patched copies of these and expects apps that use it to patch them too.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
winit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"

# jagua-rs checks every operation in debug builds, which makes dev nesting far slower.
[profile.dev.package.jagua-rs]
debug-assertions = false
