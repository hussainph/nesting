name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Link the C runtime statically so the .exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p nest-app -p nest-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/nesting.exe dist/Nesting.exe
          Copy-Item target/release/nest-cli.exe dist/nest-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nesting-windows
          path: dist/
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Nesting.exe --clobber

  linux-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo build --release -p nest-cli
      - uses: actions/upload-artifact@v4
        with:
          name: nest-cli-linux
          path: target/release/nest-cli
